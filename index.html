<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Магическая битва — Список ролей</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#12040a;color:#fff;min-height:100vh;padding:15px}
.bg{position:fixed;inset:0;z-index:-1;background:url('https://i.postimg.cc/s22NYfy2/5eaf3c6435abf357b399ab4cba7f8bd9.jpg') center/cover no-repeat;filter:brightness(1.08) saturate(1.35)}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(220,38,38,.18),rgba(20,4,12,.55))}
.wrap{max-width:600px;margin:0 auto}
.head{text-align:center;background:rgba(28,8,16,.76);backdrop-filter:blur(7px);padding:16px;border-radius:16px;border:1px solid rgba(244,63,94,.6);box-shadow:0 0 22px rgba(225,29,72,.45);margin-bottom:14px}
h1{font-size:21px;margin:4px 0;text-shadow:0 0 12px #fb7185}
.leg{font-size:13px;color:#fecdd3;margin-top:6px}
.tip{font-size:12px;color:#fda4af;margin-top:6px}
input{width:100%;padding:12px 15px;border-radius:12px;border:1px solid #f43f5e;background:rgba(24,6,14,.85);color:#fff;font-size:15px;outline:none;margin-bottom:10px}
input:focus{box-shadow:0 0 14px #f43f5e}
.btns{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button{flex:1;min-width:75px;padding:8px;border:none;border-radius:10px;background:rgba(38,10,22,.85);color:#fff;font-weight:600;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.18)}
button.act{background:#e11d48;border-color:#fda4af;box-shadow:0 0 12px rgba(225,29,72,.7)}
.grp{background:rgba(22,7,14,.76);backdrop-filter:blur(6px);border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid rgba(244,63,94,.25)}
.gt{font-size:14px;font-weight:700;color:#fda4af;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.08);margin-bottom:5px;font-size:14px;cursor:pointer}
.row:active{transform:scale(.98);background:rgba(244,63,94,.3)}
.st{font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px}
.z{background:rgba(244,63,94,.32);color:#fecdd3}
.s{background:rgba(34,197,94,.3);color:#86efac}
.b{background:rgba(148,163,184,.3);color:#e2e8f0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e11d48;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="head">
<div>⭐⭐⭐⭐⭐⭐⭐⭐</div>
<h1>🤩ᴀгичᴇскᴀя ҕитвᴀ.</h1>
<div>⭐⭐⭐⭐⭐⭐⭐</div>
<div class="leg">занят — ♥️ &nbsp;|&nbsp; свободен — 🟢 &nbsp;|&nbsp; бронь — 🌑</div>
<div class="tip">💡 Нажми на персонажа, чтобы скопировать его имя</div>
</div>
<input id="q" placeholder="🔍 Найти персонажа..." oninput="render()">
<div class="btns">
<button class="act" onclick="setF('all',this)">Все</button>
<button onclick="setF('s',this)">Свободен 🟢</button>
<button onclick="setF('z',this)">Занят ♥️</button>
<button onclick="setF('b',this)">Бронь 🌑</button>
</div>
<div id="list"></div>
</div>
<div id="toast">Скопировано!</div>
<script>
const data = [
["Токийская школа: Преподаватели",["Масамичи Яга|s","Сатору Годжо|s","Ацуя Кусакабэ|s","Киетака Иджичи|s","Секо Иейри|s","Акари Нитта|s"]],
["Токийская школа: 1 курс",["Итадори Юджи|z","Мегуми Фушигуро|z","Нобара Кугисаки|z"]],
["Токийская школа: 2 курс",["Маки Зенин|z","Тоге Инумаки|s","Панда|s","Юта Оккоцу|z"]],
["Токийская школа: 3 курс",["Киндзи Хакари|s","Кирара Хоши|s"]],
["Киотская школа: Преподаватели",["Ёсинобу Гакугандзи|s","Утахимэ Иори|s"]],
["Киотская школа: 1 курс",["Арата Нитта|s"]],
["Киотская школа: 2 курс",["Май Зенин|s","Кокичи Мута|s","Мива Касуми|s"]],
["Киотская школа: 3 курс",["Норитоши Камо|z","Аой Тодо|z","Момо Нисимия|s"]],
["Профессиональные колдуны",["Кенто Нанами|z","Такума Ино|z","Мей Мей|z","Мастер Тенген|s"]],
["Семья Зенин",["Наобито Зенин|s","Наоя Зенин|z","Оги Зенин|s","Ранта Зенин|s","Дзиничи Зенин|s","Чодзюро Зенин|s","Нобуаки Зенин|s"]],
["Проклятые духи",["Махито|z","Дзёго|s","Ханами|s","Дагон|s","Проклятая Рика|s","Кучисаке-Онна|s","Тамамоно-Мэ|s","Ганеша|s","Чосо|z","Эсу Кечидзу|s","Когай|s"]],
["Оригинальная группа Гето",["Сугуру Гето|z","Мимико Хасаба|s","Нанако Хасаба|s","Мигель|s"]],
["Оригинальная группа",["Кендзяку|z","Урауме|s","Дзюдзо Кумия|s","Харуто Сигемо|s"]],
["Остальные",["Тоджи Фушигуро|s","Шиу Конг|s","Сэцуко Сасаки|s","Такеши Игучи|s","Шота Ито|s","Цумики Фушигуро|s","Юко Одзава|s","Рика Оримото|s","Такада-тян|s","Рико Аманай|s","Мисато Курой|s","Сукуна Ремен|z","Юй Юй|s","Юки Тсукумо|z"]]
];
let cur = 'all';
const map = {z:['z','♥️ Занят'],s:['s','🟢 Свободен'],b:['b','🌑 Бронь']};
function setF(f,el){cur=f;document.querySelectorAll('button').forEach(b=>b.classList.remove('act'));el.classList.add('act');render();}
function cp(n){navigator.clipboard.writeText(n);const t=document.getElementById('toast');t.textContent='Скопировано: '+n;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function render(){
const v = document.getElementById('q').value.toLowerCase();
let h = '';
data.forEach(g=>{
let rows = g[1].map(i=>i.split('|')).filter(x=>(cur==='all'||x[1]===cur)&&x[0].toLowerCase().includes(v));
if(rows.length){
h += `<div class="grp"><div class="gt">${g[0]}</div>` + rows.map(x=>`<div class="row" onclick="cp('${x[0]}')"><span>${x[0]}</span><span class="st ${map[x[1]][0]}">${map[x[1]][1]}</span></div>`).join('') + `</div>`;
}
});
document.getElementById('list').innerHTML = h || '<div class="grp" style="text-align:center">Никого не найдено</div>';
}
render();
</script>
</body>
</html>
